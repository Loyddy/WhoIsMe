<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科幻个人主页 · AI 分身</title>
    <style>
        /* ----- 科幻风重设 & 变量 ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0b0d1a;
            --bg-card: rgba(18, 22, 40, 0.75);
            --border-glow: #6b5cff;
            --text-primary: #e8eaff;
            --text-secondary: #a6b0e0;
            --accent-cyan: #00e5ff;
            --accent-purple: #b388ff;
            --shadow-glow: 0 0 30px rgba(0, 229, 255, 0.15);
            --font-mono: 'Segoe UI', 'JetBrains Mono', monospace;
            --radius-lg: 24px;
            --radius-sm: 14px;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #141a2b, #07090f 90%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: var(--font-mono);
            color: var(--text-primary);
            padding: 24px;
            backdrop-filter: blur(2px);
            margin: 0;
            /* 保证canvas覆盖全屏 */
            position: relative;
            overflow-x: hidden;
        }

        /* 动态画布背景 —— 全屏覆盖 */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;  /* 让鼠标事件穿透 */
            display: block;
        }

        /* 主容器 — 相对z-index 置于画布之上，撑满视口 */
        .container {
            display: flex;
            gap: 28px;
            max-width: 1300px;
            width: 100%;
            flex-wrap: wrap;
            position: relative;
            z-index: 10;
            /* 让两个卡片更宽，覆盖更多区域 */
            padding: 20px 30px;
            min-height: 80vh;
            align-items: stretch;
        }

        /* 卡片 — 玻璃态 + 霓虹边框，弹性扩大 */
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius-lg);
            padding: 32px 28px;
            border: 1px solid rgba(107, 92, 255, 0.25);
            box-shadow: var(--shadow-glow), inset 0 0 40px rgba(0, 229, 255, 0.03);
            flex: 1 1 40%;
            min-width: 340px;
            transition: box-shadow 0.3s ease, border-color 0.3s;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            border-color: rgba(0, 229, 255, 0.5);
            box-shadow: 0 0 45px rgba(0, 229, 255, 0.2), inset 0 0 30px rgba(0, 229, 255, 0.04);
        }

        /* ---------- 模块一：个人基本信息 (科幻精简) ---------- */
        .profile-header {
            text-align: center;
            margin-bottom: 18px;
        }

        /* 头像 —— 全息投影感 */
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 16px;
            background: linear-gradient(145deg, #3d3f7a, #1d1f3a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 2px;
            color: #b388ff;
            text-shadow: 0 0 20px #6b5cff, 0 0 60px #3d3f7a;
            border: 2px solid rgba(0, 229, 255, 0.5);
            box-shadow: 0 0 35px rgba(0, 229, 255, 0.25), inset 0 0 35px rgba(107, 92, 255, 0.3);
            transition: 0.4s;
            background-image: radial-gradient(circle at 30% 25%, #6b5cff20, transparent 60%);
            position: relative;
        }

        .avatar:hover {
            transform: scale(1.03);
            border-color: #00e5ff;
            box-shadow: 0 0 60px #00e5ff55, inset 0 0 50px #6b5cff55;
        }

        .avatar::after {
            content: '';
            position: absolute;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: radial-gradient(circle, #00e5ff10, transparent 70%);
            animation: pulseGlow 3s infinite;
            pointer-events: none;
        }

        .profile-header h2 {
            font-size: 26px;
            font-weight: 400;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #e8eaff, #b388ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
            text-shadow: 0 0 30px #6b5cff55;
        }

        .profile-header .tagline {
            color: var(--text-secondary);
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            border-top: 1px solid rgba(0, 229, 255, 0.2);
            display: inline-block;
            padding-top: 6px;
            margin-top: 4px;
        }

        .profile-desc {
            line-height: 1.7;
            color: var(--text-secondary);
            font-size: 15px;
            border-left: 2px solid rgba(0, 229, 255, 0.3);
            padding-left: 16px;
            margin: 20px 0 22px;
            background: linear-gradient(90deg, rgba(0, 229, 255, 0.03), transparent);
            flex: 1;
        }

        .profile-desc strong {
            color: #b388ff;
            font-weight: 400;
        }

        /* 社交链接 */
        .social-links {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .social-links a {
            text-decoration: none;
            color: var(--text-primary);
            background: rgba(0, 229, 255, 0.06);
            border: 1px solid rgba(0, 229, 255, 0.25);
            padding: 10px 28px;
            border-radius: 60px;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1.5px;
            backdrop-filter: blur(8px);
            transition: all 0.25s ease;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.05);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .social-links a:hover {
            background: rgba(0, 229, 255, 0.15);
            border-color: #00e5ff;
            box-shadow: 0 0 30px #00e5ff44, inset 0 0 20px #00e5ff22;
            transform: translateY(-2px);
            color: #fff;
        }

        .social-links a:active {
            transform: scale(0.96);
        }

        /* ---------- 模块二：AI 聊天框 (科幻感) ---------- */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 500px;
            padding: 28px 24px 24px;
            background: rgba(10, 12, 28, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 229, 255, 0.2);
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.06), inset 0 0 50px rgba(0, 0, 0, 0.5);
            flex: 1;
            min-height: 460px;
        }

        .chat-title {
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 4px;
            color: var(--accent-cyan);
            text-shadow: 0 0 20px #00e5ff66;
            border-bottom: 1px solid rgba(0, 229, 255, 0.2);
            padding-bottom: 14px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-title::before {
            content: "⟡";
            font-size: 24px;
            opacity: 0.8;
        }

        /* 聊天记录区域 */
        .chat-box {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 6px;
            scroll-behavior: smooth;
        }

        /* 消息气泡 */
        .message {
            max-width: 82%;
            padding: 14px 18px;
            border-radius: 20px;
            font-size: 14px;
            line-height: 1.6;
            letter-spacing: 0.3px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            word-break: break-word;
        }

        .msg-ai {
            background: rgba(40, 45, 85, 0.7);
            color: #d0d9ff;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border-left: 2px solid var(--accent-cyan);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.08);
            backdrop-filter: blur(4px);
        }

        .msg-user {
            background: linear-gradient(135deg, #2f2f7a, #1b1d4a);
            color: #f0f3ff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            border-right: 2px solid var(--accent-purple);
            box-shadow: 0 0 25px rgba(107, 92, 255, 0.2);
        }

        /* 输入区域 */
        .input-area {
            display: flex;
            gap: 12px;
            margin-top: 6px;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px;
            border-radius: 80px;
            border: 1px solid rgba(0, 229, 255, 0.15);
            backdrop-filter: blur(8px);
            transition: border 0.2s;
        }

        .input-area:focus-within {
            border-color: #00e5ff;
            box-shadow: 0 0 30px #00e5ff22;
        }

        .input-area input {
            flex: 1;
            padding: 14px 18px;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 14px;
            font-family: var(--font-mono);
            letter-spacing: 0.5px;
        }

        .input-area input::placeholder {
            color: #6a72a0;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .input-area button {
            background: linear-gradient(145deg, #3d3f7a, #26285a);
            border: none;
            color: white;
            padding: 0 26px;
            border-radius: 60px;
            font-weight: 500;
            font-size: 14px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.25s;
            border: 1px solid rgba(0, 229, 255, 0.2);
            text-shadow: 0 0 10px #6b5cff;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.1);
            font-family: var(--font-mono);
        }

        .input-area button:hover {
            background: linear-gradient(145deg, #5f5bb0, #3d3f7a);
            border-color: #00e5ff;
            box-shadow: 0 0 40px #00e5ff33, inset 0 0 20px #6b5cff44;
            transform: scale(1.02);
        }

        .input-area button:active {
            transform: scale(0.95);
        }


        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #6b5cff, #00e5ff);
            border-radius: 10px;
            box-shadow: 0 0 20px #6b5cff66;
        }

        @media (max-width: 760px) {
            .container {
                flex-direction: column;
                align-items: center;
                padding: 10px 12px;
                min-height: 100vh;
            }

            .card {
                min-width: 0;
                width: 100%;
                flex: 1 1 auto;
            }

            .chat-container {
                height: 420px;
                min-height: 360px;
            }

            .social-links a {
                padding: 8px 20px;
                font-size: 13px;
            }
        }

        @keyframes pulseGlow {
            0% { opacity: 0.4; }
            50% { opacity: 0.8; }
            100% { opacity: 0.4; }
        }

        .card .profile-desc {
            flex: 1;
        }
    </style>
</head>
<body>

    <!-- 动态画布背景 -->
    <canvas id="bg-canvas"></canvas>

    <div class="container">
        <!-- 模块一：个人基本信息-->
        <div class="card">
            <div class="profile-header">
                <div class="avatar">✦</div>
                <h2>Loyd_Wang</h2>
                <span class="tagline">Fortune Favors the Sweat</span>
            </div>

            <div class="profile-desc">
                <p>👾 终身学习者 · 构建未来的碎片。<br>
                欢迎进入我的个人星域。右侧是我的 <strong>AI 分身</strong>，你可以直接向它提问，快速了解我的世界。</p>
            </div>

            <!-- GitHub 和 Email -->
            <div class="social-links">
                <a href="https://github.com/Loyddy" target="_blank">
                    <span style="opacity:0.7;">⌨</span> GitHub
                </a>
                <a href="mailto:hunshi061226@163.com">
                    <span style="opacity:0.7;">✉</span> Email
                </a>
            </div>
        </div>

        <!-- 模块二：AI 对话框  -->
        <div class="card chat-container">
            <div class="chat-title">AI Avatar</div>
            <div class="chat-box" id="chat-box">
                <div class="message msg-ai">Signal acquired. I am Master's quantum echo. What would you like to decrypt about him?</div>
            </div>
            <div class="input-area">
                <input type="text" id="user-input" placeholder="ask anything about me..." onkeypress="handleEnter(event)">
                <button onclick="sendMessage()">send</button>
            </div>
        </div>
    </div>

    <script>
        // ---------- 动态科幻背景 (粒子 + 星云) ----------
        (function initBackground() {
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let particles = [];
            const PARTICLE_COUNT = 160;
            const MAX_SPEED = 0.25;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Particle {
                constructor() {
                    this.reset();
                }
                reset() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.size = Math.random() * 2.2 + 0.6;
                    this.speedX = (Math.random() - 0.5) * MAX_SPEED * 1.8;
                    this.speedY = (Math.random() - 0.5) * MAX_SPEED * 1.8;
                    this.opacity = Math.random() * 0.6 + 0.2;
                    // 颜色：偏向蓝紫
                    this.color = `hsla(${220 + Math.random() * 60}, 80%, 70%, ${this.opacity})`;
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    if (this.x < 0 || this.x > width) { this.speedX *= -1; this.x += this.speedX * 2; }
                    if (this.y < 0 || this.y > height) { this.speedY *= -1; this.y += this.speedY * 2; }
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.shadowColor = '#6b5cff';
                    ctx.shadowBlur = 18;
                    ctx.fill();
                    // 不加shadowBlur重置以免影响其他绘制，但为了性能，单独重置
                    ctx.shadowBlur = 0;
                }
            }

            // 初始化粒子
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push(new Particle());
            }

            // 额外绘制一些缓慢漂移的“星云”光晕 (动态)
            let timeOffset = 0;

            function drawNebula() {
                // 绘制几个半透明光晕，移动
                const gradient1 = ctx.createRadialGradient(
                    width * 0.2 + Math.sin(timeOffset * 0.0003) * 80,
                    height * 0.3 + Math.cos(timeOffset * 0.0005) * 60,
                    10,
                    width * 0.2 + Math.sin(timeOffset * 0.0003) * 80,
                    height * 0.3 + Math.cos(timeOffset * 0.0005) * 60,
                    350
                );
                gradient1.addColorStop(0, 'rgba(90, 60, 255, 0.08)');
                gradient1.addColorStop(0.5, 'rgba(0, 200, 255, 0.04)');
                gradient1.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = gradient1;
                ctx.fillRect(0, 0, width, height);

                const gradient2 = ctx.createRadialGradient(
                    width * 0.8 + Math.cos(timeOffset * 0.0004) * 70,
                    height * 0.7 + Math.sin(timeOffset * 0.0006) * 50,
                    20,
                    width * 0.8 + Math.cos(timeOffset * 0.0004) * 70,
                    height * 0.7 + Math.sin(timeOffset * 0.0006) * 50,
                    400
                );
                gradient2.addColorStop(0, 'rgba(180, 70, 255, 0.06)');
                gradient2.addColorStop(0.6, 'rgba(0, 150, 255, 0.03)');
                gradient2.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = gradient2;
                ctx.fillRect(0, 0, width, height);
            }

            function drawLines() {
                // 连接靠近的粒子，形成网状
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 140) {
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            const alpha = (1 - dist / 140) * 0.25;
                            ctx.strokeStyle = `rgba(120, 160, 255, ${alpha})`;
                            ctx.lineWidth = 0.6;
                            ctx.shadowBlur = 8;
                            ctx.shadowColor = '#6b5cff';
                            ctx.stroke();
                            ctx.shadowBlur = 0;
                        }
                    }
                }
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);
                // 绘制背景深空（保持透明，让css背景透出一点）
                // 但我们的canvas覆盖，所以直接绘制半透明底色
                ctx.fillStyle = 'rgba(7, 9, 15, 0.3)';
                ctx.fillRect(0, 0, width, height);

                timeOffset += 1;
                drawNebula();

                // 更新和绘制粒子
                for (let p of particles) {
                    p.update();
                    p.draw();
                }
                drawLines();

                requestAnimationFrame(animate);
            }

            animate();
        })();

        // ---------- AI 聊天逻辑 ----------
        const BACKEND_URL = "https://backend-render-qs89.onrender.com/api/chat";

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const text = inputField.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            inputField.value = '';

            const loadingId = appendMessage('⟡ 正在处理神经信号 ...', 'ai');

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove();
                if (data.reply) {
                    appendMessage(data.reply, 'ai');
                } else {
                    appendMessage("⚠️ 量子链路波动，请稍后再试。", 'ai');
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage("❌ 无法连接到 AI 核心，请检查后端服务 (CORS)。", 'ai');
            }
        }

        function appendMessage(text, sender) {
            const chatBox = document.getElementById('chat-box');
            const msgDiv = document.createElement('div');
            const msgId = 'msg-' + Date.now() + '-' + Math.random().toString(36).substr(2, 6);
            msgDiv.id = msgId;
            msgDiv.className = `message msg-${sender}`;
            msgDiv.textContent = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgId;
        }

        function handleEnter(event) {
            if (event.key === 'Enter') sendMessage();
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('user-input').focus();
        });
    </script>
</body>
</html>
