    <!-- 左侧卡片 -->
    <div class="card left-card">
        <div class="profile-header">
            <div class="avatar">
                <img src="avatar.jpg" alt="Loyd_Wang Avatar">
            </div>
            <h2>Loyd_Wang</h2>
            <span class="tagline" data-i18n="tagline">越努力，越幸运</span>
        </div>

        <div class="profile-desc" data-i18n="profileDesc">
            <p>欢迎！右侧是我的 <strong>AI 分身</strong>。欢迎与它对话，探索解锁我的个人档案。</p>
        </div>

        <div class="section-block">
            <div class="section-title" data-i18n="techStackTitle">核心技术栈</div>
            <div class="tree-container" id="tree-container">加载技能中...</div>
        </div>

        <div class="section-block">
            <div class="section-title" data-i18n="featuredProjectsTitle">精选项目</div>
            <div class="repo-list" id="repoList">加载项目中...</div>
        </div>
    </div>

    <!-- 右侧 AI 聊天卡片 -->
    <div class="card chat-card">
        <div class="chat-title" data-i18n="chatTitle">AI 分身</div>
        <div class="chat-box" id="chat-box">
            <div class="message msg-ai" data-i18n="initialMsg">信号已建立。我是 Master 的量子回响。告诉我你的身份，你想解密关于 Master 的什么信息？（你可以使用任何语言）</div>
        </div>

        <!-- 快捷提问气泡组件 -->
        <div class="quick-prompts" id="quick-prompts">
            <button class="prompt-btn" id="prompt-1" data-i18n="prompt1Btn" onclick="sendQuickPrompt('prompt1Query')">⚡ 核心技术栈</button>
            <button class="prompt-btn" id="prompt-2" data-i18n="prompt2Btn" onclick="sendQuickPrompt('prompt2Query')">💼 我的项目</button>
            <button class="prompt-btn" id="prompt-3" data-i18n="prompt3Btn" onclick="sendQuickPrompt('prompt3Query')">📫 联系方式</button>
            <button class="prompt-btn" id="prompt-4" data-i18n="prompt4Btn" onclick="sendQuickPrompt('prompt4Query')">🎲 个人趣事</button>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" data-i18n-placeholder="inputPlaceholder" placeholder="关于他，随便问点什么..." onkeydown="handleEnter(event)">
            <button id="send-btn" onclick="sendMessage()" data-i18n="sendBtn">发送</button>
            <button class="btn-reset" id="reset-btn" onclick="resetChat()" data-i18n-title="resetTitle" title="重置对话">⟳</button>
        </div>
    </div>
</div>

<!-- 右下角鼠标联动 HUD 控制面板 -->
<div class="mouse-hud" id="mouse-hud">
    <div class="hud-header" onclick="toggleHud()">
        <span class="hud-title" data-i18n="hudTitle">⚡ 鼠标联动 // HUD</span>
        <span class="hud-toggle-icon" id="hud-toggle-icon">−</span>
    </div>
    <div class="hud-body" id="hud-body">
        <div class="hud-coords">
            X: <span id="hud-x">0000</span> | Y: <span id="hud-y">0000</span>
        </div>
        <div class="hud-modes">
            <button class="hud-btn" id="hud-btn-repel" onclick="setMouseMode('repel', this)" data-i18n="hudRepel" data-i18n-title="hudRepelTitle" title="粒子避开鼠标">排斥</button>
            <button class="hud-btn" id="hud-btn-attract" onclick="setMouseMode('attract', this)" data-i18n="hudAttract" data-i18n-title="hudAttractTitle" title="粒子向鼠标聚集">吸引</button>
            <button class="hud-btn active" id="hud-btn-connect" onclick="setMouseMode('connect', this)" data-i18n="hudConnect" data-i18n-title="hudConnectTitle" title="鼠标与粒子连线">连线</button>
            <button class="hud-btn" id="hud-btn-off" onclick="setMouseMode('off', this)" data-i18n="hudOff" data-i18n-title="hudOffTitle" title="关闭交互">关闭</button>
        </div>
    </div>
</div>

<script src="script.js"></script>

</html>
