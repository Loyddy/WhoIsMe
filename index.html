<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Pages 测试页面</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        .icon {
            font-size: 50px;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 24px;
            color: #2d3748;
            margin-bottom: 10px;
        }
        p {
            color: #718096;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .status {
            display: inline-block;
            background-color: #c6f6d5;
            color: #22543d;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .time-box {
            font-size: 12px;
            color: #a0aec0;
            border-top: 1px solid #e2e8f0;
            padding-top: 15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🎉</div>
        <div class="status">🟢 GitHub Pages 运行正常</div>
        <h1>恭喜！网站部署成功！</h1>
        <p>如果你看到了这个页面，说明你的 GitHub Pages 已经配置完成，`index.html` 正确被解析响应。</p>
        <div class="time-box">
            页面加载时间：<span id="load-time">加载中...</span>
        </div>
    </div>

    <script>
        // 自动显示本地访问时间，便于测试浏览器缓存
        document.getElementById('load-time').innerText = new Date().toLocaleString();
    </script>
</body>
</html>
