<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页 & AI 分身</title>
    <style>
        :root {
            --primary-color: #9b72cf; /* 淡紫色主色调 */
            --bg-color: #f7f5fb;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-light: #666666;
            --border-radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            display: flex;
            gap: 24px;
            max-width: 1000px;
            width: 100%;
            flex-wrap: wrap;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 30px;
            box-shadow: 0 8px 24px rgba(155, 114, 207, 0.1);
            flex: 1;
            min-width: 320px;
        }

        /* 模块一：基本信息 */
        .profile-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: var(--primary-color);
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        .social-links {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }
        .social-links a {
            text-decoration: none;
            color: white;
            background-color: var(--primary-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            transition: opacity 0.3s;
        }
        .social-links a:hover { opacity: 0.8; }

        /* 模块二：AI 聊天框 */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 400px;
        }
        .chat-title {
            margin-bottom: 15px;
            color: var(--primary-color);
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        .chat-box {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
        }
        .msg-ai {
            background-color: #f0e6ff;
            color: #4a2b75;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .msg-user {
            background-color: var(--primary-color);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
        }
        .input-area input:focus {
            border-color: var(--primary-color);
        }
        .input-area button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        .input-area button:hover {
            background-color: #835cba;
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d3c4e3; border-radius: 3px; }
    </style>
</head>
<body>

<div class="container">
    <!-- 模块一：个人基本信息 -->
    <div class="card">
        <div class="profile-header">
            <div class="avatar">头像</div>
            <h2>你的名字</h2>
            <p style="color: var(--text-light); margin-top: 10px;">前端开发者 / AI 爱好者 / 终身学习者</p>
        </div>
        <div style="line-height: 1.8; color: var(--text-light);">
            <p>你好！欢迎来到我的主页。我致力于构建优秀的 Web 应用程序。右侧是我的数字分身，如果你想快速了解我，可以直接向它提问！</p>
        </div>
        <div class="social-links">
            <a href="https://github.com/你的用户名" target="_blank">GitHub</a>
            <a href="https://twitter.com/你的用户名" target="_blank">Twitter</a>
            <a href="mailto:your-email@example.com">Email</a>
        </div>
    </div>

    <!-- 模块二：AI 分身对话框 -->
    <div class="card chat-container">
        <h3 class="chat-title">✨ 我的 AI 分身</h3>
        <div class="chat-box" id="chat-box">
            <div class="message msg-ai">你好！我是主人的 AI 分身，我已经掌握了他的基本信息、技能栈和项目经历。你想了解关于他的什么呢？</div>
        </div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="问我任何关于他的问题..." onkeypress="handleEnter(event)">
            <button onclick="sendMessage()">发送</button>
        </div>
    </div>
</div>

<script>
    const BACKEND_URL = "https://backend-render-qs89.onrender.com";

    async function sendMessage() {
        const inputField = document.getElementById('user-input');
        const text = inputField.value.trim();
        if (!text) return;

        appendMessage(text, 'user');
        inputField.value = '';

        const loadingId = appendMessage('正在思考中...', 'ai');

        try {
            const response = await fetch(BACKEND_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });

            const data = await response.json();

            // 移除 Loading 状态并添加真实回复
            document.getElementById(loadingId).remove();
            if(data.reply) {
                appendMessage(data.reply, 'ai');
            } else {
                appendMessage("抱歉，我的大脑暂时断线了，请稍后再试。", 'ai');
            }
        } catch (error) {
            document.getElementById(loadingId).remove();
            appendMessage("网络请求失败，请确保后端服务已启动并配置了跨域(CORS)。", 'ai');
        }
    }

    function appendMessage(text, sender) {
        const chatBox = document.getElementById('chat-box');
        const msgDiv = document.createElement('div');
        const msgId = 'msg-' + Date.now();
        msgDiv.id = msgId;
        msgDiv.className = `message msg-${sender}`;
        msgDiv.textContent = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        return msgId;
    }

    function handleEnter(event) {
        if (event.key === 'Enter') sendMessage();
    }
</script>

</body>
</html>
